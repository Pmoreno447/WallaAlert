services:
  bot:
    build: .
    image: wallaalert
    restart: unless-stopped
    init: true # reenvía bien las señales de parada al proceso de Node
    env_file: .env # TELEGRAM_BOT_TOKEN y TELEGRAM_ADMIN_ID
    environment:
      DATABASE_PATH: /data/bot.db # tiene prioridad sobre .env: la base de datos va siempre al volumen
      TZ: Europe/Madrid # zona horaria de los registros
    volumes:
      - bot-data:/data

volumes:
  bot-data:
    name: wallaalert-data # nombre fijo, no depende de la carpeta del proyecto
